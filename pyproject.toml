[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-mof-gcmc"
version = "0.2.0"
description = "CUDA-accelerated Hybrid GPU-GCMC + MLIP Nested Monte Carlo Engine for gas adsorption in nanoporous frameworks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "ase>=3.22",
]

[project.optional-dependencies]
mlip = [
    "mace-torch>=0.3.10",
    "torch-dftd>=0.5.0",
    "e3nn>=0.4.4",
    "matscipy>=1.1",
]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
    "mlip: tests requiring MACE/PyTorch MLIP model weights",
    "slow: longer statistical convergence tests",
]
